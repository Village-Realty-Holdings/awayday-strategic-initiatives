# Local Postgres for development (matches Neon's Postgres 18). `docker compose up -d`.
# Deployed environments use Neon: `production` and `development` branches via Hyperdrive.
services:
  postgres:
    image: postgres:18-alpine
    container_name: awayday-strategic-initiatives-postgres
    environment:
      POSTGRES_USER: awayday
      POSTGRES_PASSWORD: password
      POSTGRES_DB: awayday_strategic_initiatives
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awayday -d awayday_strategic_initiatives"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
